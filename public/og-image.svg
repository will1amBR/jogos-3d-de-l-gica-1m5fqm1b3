<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B5E20" />
      <stop offset="50%" stop-color="#2E7D32" />
      <stop offset="100%" stop-color="#0E3914" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF176" />
      <stop offset="50%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FFA000" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9F0" />
      <stop offset="100%" stop-color="#F5EBD7" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle Decorative Circles -->
  <circle cx="150" cy="100" r="280" fill="#8BC34A" opacity="0.08"/>
  <circle cx="1050" cy="520" r="320" fill="#FFD54F" opacity="0.08"/>
  <circle cx="950" cy="120" r="200" fill="#81C784" opacity="0.07"/>

  <!-- Left Side: Hero Brand -->
  <!-- Stylized G Emblem -->
  <g transform="translate(100, 110)">
    <rect x="0" y="0" width="130" height="130" rx="32" fill="url(#goldGrad)" filter="url(#softGlow)"/>
    <rect x="6" y="6" width="118" height="118" rx="26" fill="#1B5E20"/>
    <text x="65" y="92" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="82" fill="url(#goldGrad)" text-anchor="middle">G</text>
  </g>

  <!-- Brand Typography -->
  <text x="260" y="180" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="64" fill="#FFFFFF" letter-spacing="-1">
    Glik <tspan fill="#81C784">Games</tspan>
  </text>
  <text x="260" y="225" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="22" fill="#FFD54F" letter-spacing="2">
    JOGOS 3D DE LÓGICA &amp; FAZENDA RPG
  </text>

  <!-- Tagline / Description -->
  <text x="100" y="315" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="26" fill="#F1F8E9">
    Jogos 3D, Paciência Spider, Mahjong Solitaire e Ação 2D
  </text>
  <text x="100" y="355" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="20" fill="#C8E6C9">
    Evolua seu nível de jogador, acumule ouro e expanda seu império agrícola!
  </text>

  <!-- Feature Badges -->
  <g transform="translate(100, 420)">
    <!-- Badge 1: Jogos 3D -->
    <g transform="translate(0, 0)">
      <rect width="210" height="110" rx="20" fill="url(#cardGrad)" filter="url(#softGlow)"/>
      <text x="105" y="45" font-size="32" text-anchor="middle">🎲</text>
      <text x="105" y="75" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="16" fill="#1B5E20" text-anchor="middle">Jogos 3D</text>
      <text x="105" y="94" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" fill="#5D4037" text-anchor="middle">Fazenda • Garrafas • Tetris</text>
    </g>

    <!-- Badge 2: Cartas -->
    <g transform="translate(230, 0)">
      <rect width="210" height="110" rx="20" fill="url(#cardGrad)" filter="url(#softGlow)"/>
      <text x="105" y="45" font-size="32" text-anchor="middle">🎴</text>
      <text x="105" y="75" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="16" fill="#1B5E20" text-anchor="middle">Jogos de Carta</text>
      <text x="105" y="94" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" fill="#5D4037" text-anchor="middle">Spider • Mahjong Solitaire</text>
    </g>

    <!-- Badge 3: Ação 2D -->
    <g transform="translate(460, 0)">
      <rect width="210" height="110" rx="20" fill="url(#cardGrad)" filter="url(#softGlow)"/>
      <text x="105" y="45" font-size="32" text-anchor="middle">⚡</text>
      <text x="105" y="75" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="16" fill="#1B5E20" text-anchor="middle">Ação 2D</text>
      <text x="105" y="94" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" fill="#5D4037" text-anchor="middle">Aeronave • Corrida Vale</text>
    </g>

    <!-- Badge 4: Progresso Compartilhado -->
    <g transform="translate(690, 0)">
      <rect width="250" height="110" rx="20" fill="url(#cardGrad)" filter="url(#softGlow)"/>
      <text x="125" y="45" font-size="32" text-anchor="middle">🏆</text>
      <text x="125" y="75" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="16" fill="#E65100" text-anchor="middle">Progresso na Nuvem</text>
      <text x="125" y="94" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" fill="#5D4037" text-anchor="middle">Nível • Ouro • Conquistas</text>
    </g>
  </g>

  <!-- Sparkle Stars -->
  <polygon points="1080,140 1084,128 1088,140 1100,144 1088,148 1084,160 1080,148 1068,144" fill="#FFD54F" />
  <polygon points="980,240 983,230 986,240 996,243 986,246 983,256 980,246 970,243" fill="#81C784" />
</svg>
